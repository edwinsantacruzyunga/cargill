<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; color: white; background: linear-gradient(135deg, #172554, #2563eb); text-align: center; }

<body>
  <main>
    <h1>¡Hola, mundo! 👋</h1>
    <p>Mi primer proyecto publicado en GitHub.</p>

</html>
